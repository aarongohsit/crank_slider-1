<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crank Slider - Inversion 1</title>
<style>
  body { margin: 0; background: #121826; color: #edf2ff; font-family: system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #canvas-container { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .controls { width: 340px; background: #171d2b; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid #242d42; overflow-y: auto; }
  .group { background: #1f2636; padding: 12px; border-radius: 8px; border: 1px solid #2a3550; }
  .group-title { font-weight: bold; margin-bottom: 8px; color: #4f74b8; font-size: 13px; text-transform: uppercase; }
  label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
  input[type="number"], input[type="range"], select { width: 100%; margin-top: 2px; background: #121826; border: 1px solid #35405c; color: #fff; padding: 5px; border-radius: 4px; box-sizing: border-box; }
  .row { display: flex; gap: 6px; }
  button { flex: 1; padding: 8px; background: #4f74b8; border: none; color: #fff; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
  button:hover { background: #5b82cb; }
  button.active { background: #f0b35a; }
  button.secondary { background: #2a3550; }
  button.secondary:hover { background: #39476b; }
  button.danger { background: #9b4a59; }
  button.danger:hover { background: #b85869; }
  .toggle-btn { background: #243147; border: 1px solid #35405c; color: #9fb0d3; padding: 3px 6px; font-size: 10px; border-radius: 4px; flex: 0; cursor: pointer; }
  .toggle-btn:hover { background: #324361; }
  .toggle-btn.off { color: #606b82; background: #171d2b; text-decoration: line-through; }
  .status { font-size: 12px; color: #58d19f; margin-top: 4px; }
  .status.error { color: #f26d7d; }
  .readouts { font-size: 12px; font-family: monospace; display: flex; flex-direction: column; gap: 3px; }
  .coupler-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .coupler-item { background: #121826; border: 1px solid #2a3550; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 11px; }
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="scene"></canvas>
</div>

<div class="controls">
  <h3 style="margin: 0 0 5px 0;">Inversion 1 Controls</h3>

  <!-- View Controls -->
  <div class="group">
    <div class="group-title">View</div>
    <div class="row">
      <button id="resetPanBtn" class="secondary">Reset Pan/Zoom</button>
    </div>
  </div>

  <!-- Ground Orientation Settings -->
  <div class="group">
    <div class="group-title">Ground Setup</div>
    <label>Ground Angle (deg)
      <input type="number" id="groundAngle" value="0" step="1">
    </label>
    <label style="flex-direction: column; align-items: flex-start;">Offset Direction
      <select id="offsetAngleSelect">
        <option value="90">Ground Angle + 90°</option>
        <option value="270" selected>Ground Angle + 270°</option>
      </select>
    </label>
  </div>

  <!-- Grouped Link Dimensions -->
  <div class="group">
    <div class="group-title">Link Dimensions</div>
    <label>Crank Radius (r2)
      <input type="number" id="crankLen" value="200" step="5">
    </label>
    <label>Connecting Rod (r3)
      <input type="number" id="rodLen" value="400" step="5">
    </label>
    <label>Slider Offset (r1)
      <input type="number" id="offset" value="0" step="5" min="0">
    </label>
  </div>

  <!-- Coupler Points Panel -->
  <div class="group">
    <div class="group-title">Coupler Points (Max 5)</div>
    <div class="row">
      <button id="addCouplerBtn" class="secondary">+ Add Point</button>
      <button id="clearCouplersBtn" class="danger">Clear All</button>
    </div>
    <div id="couplerContainer" class="coupler-list"></div>
  </div>

  <!-- Animation & Input -->
  <div class="group">
    <div class="group-title">Kinematics</div>
    <label>Crank Angle (deg)
      <input type="range" id="crankAngle" min="0" max="360" value="45">
    </label>
    <button id="togglePlay">Play Animation</button>
  </div>

  <!-- Live Kinematic Data -->
  <div class="group">
    <div class="group-title">Measurements</div>
    <div class="readouts">
      <div>Crank Angle: <span id="outCrankAng">0</span>°</div>
      <div>Rod Angle: <span id="outRodAng">0</span>°</div>
      <div>Transmission Angle (γ): <span id="outTransAng">0</span>°</div>
      <div>Actual Rod Length: <span id="outRodLen">0</span> px</div>
      <div>Stroke Range: <span id="outStroke">0</span> px</div>
    </div>
  </div>

  <div id="status" class="status">System Status: OK</div>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

// UI Controls
const groundAngleInput = document.getElementById('groundAngle');
const offsetAngleSelect = document.getElementById('offsetAngleSelect');
const crankLenInput = document.getElementById('crankLen');
const rodLenInput = document.getElementById('rodLen');
const offsetInput = document.getElementById('offset');
const crankAngleInput = document.getElementById('crankAngle');
const togglePlayBtn = document.getElementById('togglePlay');
const resetPanBtn = document.getElementById('resetPanBtn');
const addCouplerBtn = document.getElementById('addCouplerBtn');
const clearCouplersBtn = document.getElementById('clearCouplersBtn');
const couplerContainer = document.getElementById('couplerContainer');
const statusEl = document.getElementById('status');

// Readouts
const outCrankAng = document.getElementById('outCrankAng');
const outRodAng = document.getElementById('outRodAng');
const outTransAng = document.getElementById('outTransAng');
const outRodLen = document.getElementById('outRodLen');
const outStroke = document.getElementById('outStroke');

// Interaction & State Variables
let isPlaying = false;
let animId = null;
let panX = 0, panY = 0;
let isPanning = false, startPanX = 0, startPanY = 0;

const getPointName = (idx) => String.fromCharCode(69 + idx);
const couplerColors = ['#e74c3c', '#9b59b6', '#2ecc71', '#e67e22', '#1abc9c'];
let couplerPoints = [];

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

function solveLocalKinematics(crankR, rodL, offsetE, offsetAngleRad, crankRad) {
  const Bx = crankR * Math.cos(crankRad);
  const By = -crankR * Math.sin(crankRad);

  const P1x = offsetE * Math.cos(offsetAngleRad);
  const P1y = -offsetE * Math.sin(offsetAngleRad);

  const dirX = 1;
  const dirY = 0;

  const dx = P1x - Bx;
  const dy = P1y - By;

  const a = 1; 
  const b = 2 * (dx * dirX + dy * dirY);
  const c = (dx * dx + dy * dy) - (rodL * rodL);

  const disc = b * b - 4 * a * c;
  if (disc < 0) return null;

  const t = (-b + Math.sqrt(disc)) / (2 * a);

  const Dx = P1x + t * dirX;
  const Dy = P1y + t * dirY;

  return { Bx, By, Dx, Dy, P1x, P1y, dPath: t };
}

function getCouplerPointPos(Bx, By, Dx, Dy, dist, angleDeg) {
  const rodAngleLocal = Math.atan2(Dy - By, Dx - Bx);
  const totalAngle = rodAngleLocal - (angleDeg * Math.PI / 180);

  return {
    x: Bx + dist * Math.cos(totalAngle),
    y: By + dist * Math.sin(totalAngle)
  };
}

function drawUnrotatedText(text, localX, localY, font, fillStyle, textAlign = 'center', textBaseline = 'alphabetic') {
  const groundRad = (parseFloat(groundAngleInput.value) || 0) * Math.PI / 180;
  ctx.save();
  ctx.translate(localX, localY);
  ctx.rotate(groundRad);
  ctx.font = font;
  ctx.fillStyle = fillStyle;
  ctx.textAlign = textAlign;
  ctx.textBaseline = textBaseline;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function renderCouplerControls() {
  couplerContainer.innerHTML = '';
  couplerPoints.forEach((cp, idx) => {
    const name = getPointName(idx);
    const div = document.createElement('div');
    div.className = 'coupler-item';
    div.innerHTML = `
      <span style="color:${couplerColors[idx % couplerColors.length]}; font-weight:bold;">Pt ${name}</span>
      <button class="toggle-btn ${cp.showPath ? '' : 'off'}" data-toggle="${idx}">${cp.showPath ? 'Path On' : 'Path Off'}</button>
      <label style="margin:0;">Dist B: <input type="number" step="5" value="${cp.dist}" style="width:40px" data-idx="${idx}" data-param="dist"></label>
      <label style="margin:0;">∠ BC: <input type="number" step="5" value="${cp.angleDeg}" style="width:40px" data-idx="${idx}" data-param="angleDeg">°</label>
      <button class="danger" style="padding:2px 6px; flex:0;" data-del="${idx}">X</button>
    `;
    couplerContainer.appendChild(div);
  });
  addCouplerBtn.disabled = couplerPoints.length >= 5;
}

couplerContainer.addEventListener('input', (e) => {
  const idx = e.target.getAttribute('data-idx');
  const param = e.target.getAttribute('data-param');
  if (idx !== null && param) {
    couplerPoints[idx][param] = parseFloat(e.target.value) || 0;
    draw();
  }
});

couplerContainer.addEventListener('click', (e) => {
  const delIdx = e.target.getAttribute('data-del');
  const toggleIdx = e.target.getAttribute('data-toggle');

  if (delIdx !== null) {
    couplerPoints.splice(parseInt(delIdx), 1);
    renderCouplerControls();
    draw();
  } else if (toggleIdx !== null) {
    const i = parseInt(toggleIdx);
    couplerPoints[i].showPath = !couplerPoints[i].showPath;
    renderCouplerControls();
    draw();
  }
});

addCouplerBtn.addEventListener('click', () => {
  if (couplerPoints.length < 5) {
    couplerPoints.push({ dist: 100, angleDeg: 30 * couplerPoints.length, showPath: true });
    renderCouplerControls();
    draw();
  }
});

clearCouplersBtn.addEventListener('click', () => {
  couplerPoints = [];
  renderCouplerControls();
  draw();
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const groundDeg = parseFloat(groundAngleInput.value) || 0;
  const offsetDeg = parseFloat(offsetAngleSelect.value) || 270;
  const crankR = parseFloat(crankLenInput.value) || 0;
  const rodL = parseFloat(rodLenInput.value) || 0;
  const offsetE = Math.abs(parseFloat(offsetInput.value) || 0);
  const crankDeg = parseFloat(crankAngleInput.value) || 0;

  const groundRad = groundDeg * Math.PI / 180;
  const offsetAngleRad = offsetDeg * Math.PI / 180;
  const crankRad = crankDeg * Math.PI / 180;

  const sol = solveLocalKinematics(crankR, rodL, offsetE, offsetAngleRad, crankRad);
  if (!sol) {
    statusEl.textContent = "Status: Crank position unachievable";
    statusEl.className = "status error";
    return;
  }
  statusEl.textContent = "Status: OK";
  statusEl.className = "status";

  const { Bx, By, Dx, Dy, P1x, P1y, dPath } = sol;

  const actualRodLength = Math.hypot(Dx - Bx, Dy - By);

  const strokeMin = Math.sqrt(Math.max(0, Math.pow(rodL - crankR, 2) - offsetE * offsetE));
  const strokeMax = Math.sqrt(Math.max(0, Math.pow(rodL + crankR, 2) - offsetE * offsetE));
  const strokeLength = strokeMax - strokeMin;

  const xMinPt = { x: P1x + strokeMin, y: P1y };
  const xMaxPt = { x: P1x + strokeMax, y: P1y };

  const rodRadLocal = Math.atan2(-(Dy - By), Dx - Bx);
  const rodDegGlobal = ((rodRadLocal + groundRad) * 180 / Math.PI % 360 + 360) % 360;
  const crankDegGlobal = ((crankDeg + groundDeg) % 360 + 360) % 360;

  // Transmission Angle Calculation: gamma = 90° - |rod_angle_relative_to_slider|
  const beta = Math.abs(Math.asin((By - Dy) / rodL));
  const transmissionAngleDeg = (90 - (beta * 180 / Math.PI));

  outCrankAng.textContent = crankDegGlobal.toFixed(1);
  outRodAng.textContent = rodDegGlobal.toFixed(1);
  outTransAng.textContent = transmissionAngleDeg.toFixed(1);
  outRodLen.textContent = actualRodLength.toFixed(1);
  outStroke.textContent = strokeLength.toFixed(1);

  const originX = canvas.width / 2 + panX;
  const originY = canvas.height / 2 + panY;

  ctx.save();
  ctx.translate(originX, originY);
  ctx.rotate(-groundRad);

  // 1. Coupler Paths
  couplerPoints.forEach((cp, idx) => {
    if (!cp.showPath) return;

    ctx.beginPath();
    ctx.strokeStyle = couplerColors[idx % couplerColors.length];
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);

    let first = true;
    for (let deg = 0; deg <= 360; deg += 2) {
      const rad = deg * Math.PI / 180;
      const stepSol = solveLocalKinematics(crankR, rodL, offsetE, offsetAngleRad, rad);
      if (stepSol) {
        const pt = getCouplerPointPos(stepSol.Bx, stepSol.By, stepSol.Dx, stepSol.Dy, cp.dist, cp.angleDeg);
        if (first) { ctx.moveTo(pt.x, pt.y); first = false; }
        else { ctx.lineTo(pt.x, pt.y); }
      }
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // 2. Stroke Range Line & End Caps
  ctx.strokeStyle = '#f26d7d';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(xMinPt.x, xMinPt.y);
  ctx.lineTo(xMaxPt.x, xMaxPt.y);
  ctx.stroke();

  const capLength = 8;
  ctx.beginPath();
  ctx.moveTo(xMinPt.x, xMinPt.y - capLength); ctx.lineTo(xMinPt.x, xMinPt.y + capLength);
  ctx.moveTo(xMaxPt.x, xMaxPt.y - capLength); ctx.lineTo(xMaxPt.x, xMaxPt.y + capLength);
  ctx.stroke();

  const midStroke = { x: (xMinPt.x + xMaxPt.x) / 2, y: (xMinPt.y + xMaxPt.y) / 2 };
  drawUnrotatedText(`Stroke: ${strokeLength.toFixed(1)}`, midStroke.x, midStroke.y + 24, '16px sans-serif', '#f26d7d');

  // 3. Offset vectors r1 and r4
  if (offsetE > 0) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(P1x, P1y);
    ctx.stroke();

    drawUnrotatedText(`r1: ${offsetE.toFixed(1)}`, P1x / 2 - 15, P1y / 2, '16px sans-serif', '#9fb0d3');
  }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(P1x, P1y);
  ctx.lineTo(Dx, Dy);
  ctx.stroke();
  ctx.setLineDash([]);

  drawUnrotatedText(`r4: ${dPath.toFixed(1)}`, (P1x + Dx) / 2, (P1y + Dy) / 2 - 12, '16px sans-serif', '#9fb0d3');

  // 4. Ground Guide Track
  ctx.strokeStyle = '#35405c';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(P1x - 80, P1y);
  ctx.lineTo(xMaxPt.x + 80, P1y);
  ctx.stroke();
  ctx.setLineDash([]);

  // Joint A
  ctx.fillStyle = '#f26d7d';
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();
  drawUnrotatedText('A', -16, 18, 'bold 18px sans-serif', '#ffffff');

  // 5. Crank Link
  ctx.strokeStyle = '#f0b35a';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Bx, By);
  ctx.stroke();
  drawUnrotatedText(`Crank r2 (${crankDegGlobal.toFixed(0)}°)`, Bx / 2 - 15, By / 2 - 12, 'bold 18px sans-serif', '#f0b35a');

  // 6. Connecting Rod Link
  ctx.strokeStyle = '#4f74b8';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(Bx, By);
  ctx.lineTo(Dx, Dy);
  ctx.stroke();
  drawUnrotatedText(`Connecting Rod r3 (${rodDegGlobal.toFixed(0)}°)`, (Bx + Dx) / 2, (By + Dy) / 2 - 14, '18px sans-serif', '#6ea8ff');

  // 7. Transmission Angle Arc at Joint C/D
  ctx.strokeStyle = '#f0b35a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const startAng = Math.PI;
  const endAng = Math.atan2(By - Dy, Bx - Dx);
  ctx.arc(Dx, Dy, 25, startAng, endAng, (By - Dy) > 0);
  ctx.stroke();
  drawUnrotatedText(`γ=${transmissionAngleDeg.toFixed(1)}°`, Dx - 40, Dy - 8, '13px monospace', '#f0b35a');

  // 8. Active Coupler Points
  couplerPoints.forEach((cp, idx) => {
    const pt = getCouplerPointPos(Bx, By, Dx, Dy, cp.dist, cp.angleDeg);
    const col = couplerColors[idx % couplerColors.length];
    const ptName = getPointName(idx);

    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Bx, By);
    ctx.lineTo(pt.x, pt.y);
    ctx.stroke();

    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
    ctx.fill();

    drawUnrotatedText(`${ptName}`, pt.x + 10, pt.y + 4, 'bold 16px sans-serif', col, 'left');
  });

  // Joint B
  ctx.fillStyle = '#edf2ff';
  ctx.beginPath();
  ctx.arc(Bx, By, 5, 0, Math.PI * 2);
  ctx.fill();
  drawUnrotatedText('B', Bx, By - 14, 'bold 18px sans-serif', '#ffffff');

  // Joint C/D Pin
  ctx.beginPath();
  ctx.arc(Dx, Dy, 5, 0, Math.PI * 2);
  ctx.fill();

  // 9. Slider Block
  const blockW = 50, blockH = 26;
  ctx.fillStyle = 'rgba(88, 209, 159, 0.8)';
  ctx.strokeStyle = '#58d19f';
  ctx.lineWidth = 2;
  ctx.fillRect(Dx - blockW / 2, Dy - blockH / 2, blockW, blockH);
  ctx.strokeRect(Dx - blockW / 2, Dy - blockH / 2, blockW, blockH);

  drawUnrotatedText(`Slider (C/D)`, Dx, Dy - blockH / 2 - 14, 'bold 18px sans-serif', '#58d19f');

  ctx.restore();
}

canvas.addEventListener('mousedown', (e) => {
  isPanning = true;
  startPanX = e.clientX - panX;
  startPanY = e.clientY - startPanY;
});

window.addEventListener('mousemove', (e) => {
  if (isPanning) {
    panX = e.clientX - startPanX;
    panY = e.clientY - startPanY;
    draw();
  }
});

window.addEventListener('mouseup', () => { isPanning = false; });

resetPanBtn.addEventListener('click', () => {
  panX = 0;
  panY = 0;
  draw();
});

function animate() {
  if (!isPlaying) return;
  let val = (parseFloat(crankAngleInput.value) + 1.5) % 360;
  crankAngleInput.value = val;
  draw();
  animId = requestAnimationFrame(animate);
}

[groundAngleInput, offsetAngleSelect, crankLenInput, rodLenInput, offsetInput, crankAngleInput].forEach(input => {
  input.addEventListener('input', draw);
});

togglePlayBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  togglePlayBtn.textContent = isPlaying ? "Pause Animation" : "Play Animation";
  togglePlayBtn.classList.toggle('active', isPlaying);
  if (isPlaying) animate();
  else cancelAnimationFrame(animId);
});

renderCouplerControls();
resize();
</script>
</body>
</html>
